{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="card" style="max-width:26rem;margin:4rem auto">
  <h1>Painel de licenças</h1>
  <p class="muted small">Área do fornecedor. Acesso restrito.</p>
  {% if error %}<p role="alert" class="flash err">{{ error }}</p>{% endif %}
  <form method="post" action="/painel/entrar" autocomplete="off">
    <label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Senha</label><input id="password" name="password" type="password" required autocomplete="current-password">
    <label for="code">Código de 6 dígitos do aplicativo autenticador{% if not totp_required %} (se a sua conta tiver){% endif %}</label>
    <input id="code" name="code" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" {% if totp_required %}required{% endif %}>
    <p><button class="primary" type="submit" style="width:100%">Entrar</button></p>
  </form>
</div>
{% endblock %}
