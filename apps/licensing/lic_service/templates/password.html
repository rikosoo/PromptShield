{% extends "base.html" %}
{% block title %}Senha{% endblock %}
{% block content %}
<div class="card" style="max-width:30rem">
  <h1>Alterar a minha senha</h1>
  <p class="muted small">Mínimo de {{ min_length }} caracteres, com letra minúscula, maiúscula, número e caractere especial. As outras sessões serão encerradas.</p>
  <form method="post" action="/painel/senha" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="current">Senha atual</label><input id="current" name="current" type="password" required autocomplete="current-password">
    <label for="new">Nova senha</label><input id="new" name="new" type="password" required minlength="{{ min_length }}" autocomplete="new-password">
    <label for="again">Repita a nova senha</label><input id="again" name="again" type="password" required autocomplete="new-password">
    <p><button class="primary" type="submit">Salvar</button></p>
  </form>
</div>
{% endblock %}
